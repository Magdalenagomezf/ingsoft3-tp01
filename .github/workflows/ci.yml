name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/backend-coverage:/out" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/resumen.md
          test -f "$F"
          cat "$F" >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/magdalenagomezf/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # puede LEER el código del repo
      packages: write     # puede SUBIR imágenes a ghcr.io
    steps:
      - name: Que estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA - commit $GITHUB_SHA"

      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/magdalenagomezf/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment: qa
    steps:
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          # imgURL va como un parámetro más de la URL del hook (que ya trae ?key=…).
          # --get --data-urlencode lo agrega con '&' y le codifica los ':' y '/' de la imagen.
          IMG_API="ghcr.io/magdalenagomezf/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/magdalenagomezf/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test de QA
        shell: bash
        env:
          URL_API: https://mallki-api-qa.onrender.com
          URL_FRONT: https://mallki-front-qa.onrender.com
        run: |
          echo "Esperando a que QA este vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" && \
               curl -fsS --max-time 10 "$URL_API/api/productos" > /dev/null && \
               curl -fsS --max-time 10 "$URL_FRONT" > /dev/null; then
              echo ""
              echo "QA responde"
              exit 0
            fi
            sleep 20
          done
          echo "QA no respondio"
          exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy de la MISMA imagen a PROD
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/magdalenagomezf/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/magdalenagomezf/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test de PROD
        shell: bash
        env:
          URL_API: https://mallki-api-prod.onrender.com
          URL_FRONT: https://mallki-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD este vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" && \
               curl -fsS --max-time 10 "$URL_API/api/productos" > /dev/null && \
               curl -fsS --max-time 10 "$URL_FRONT" > /dev/null; then
              echo ""
              echo "PROD responde"
              exit 0
            fi
            sleep 20
          done
          echo "PROD no respondio"
          exit 1
          